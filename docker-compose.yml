services:
  etcd:
    image: bitnami/etcd:3.5
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    ports:
      - "2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 5

  broker1:
    build: .
    command: ["-id", "broker-1", "-port", "8081", "-advertise-addr", "http://broker1:8081", "-etcd", "etcd:2379", "-data-dir", "/data"]
    ports:
      - "8081:8081"
    volumes:
      - broker1-data:/data
    depends_on:
      etcd:
        condition: service_healthy

  broker2:
    build: .
    command: ["-id", "broker-2", "-port", "8082", "-advertise-addr", "http://broker2:8082", "-etcd", "etcd:2379", "-data-dir", "/data"]
    ports:
      - "8082:8082"
    volumes:
      - broker2-data:/data
    depends_on:
      etcd:
        condition: service_healthy

  broker3:
    build: .
    command: ["-id", "broker-3", "-port", "8083", "-advertise-addr", "http://broker3:8083", "-etcd", "etcd:2379", "-data-dir", "/data"]
    ports:
      - "8083:8083"
    volumes:
      - broker3-data:/data
    depends_on:
      etcd:
        condition: service_healthy

volumes:
  broker1-data:
  broker2-data:
  broker3-data:
